# Mutation manifest — see scripts/mutation_check.py
target: file_ops_toolkit/runner.py
note: What a run copies, reports and refuses.
mutations:
- label: one folder is scanned once per row instead of once per folder
  find: "            runnable.setdefault(_key(os.path.normcase(job.address)), []).append(job)"
  replace: "            runnable.setdefault(str(job.row), []).append(job)"
  test: tests.test_fetch_core.RunnerTests.test_a_folder_shared_by_many_rows_is_scanned_once
- label: by_folder layout copies flat
  find: "    target = str(Path(dest) / _by_folder_name(address)) if options.layout == \"by_folder\" else dest"
  replace: "    target = dest"
  test: tests.test_fetch_core.RunnerTests.test_by_folder_layout_puts_each_source_in_its_own_subfolder
- label: a failed copy is reported as copied
  find: "        result.status = \"error\"\n"
  replace: "        result.status = \"copied\"\n"
  test: tests.test_fetch_core.RunnerTests.test_one_failing_copy_is_reported_and_the_rest_continue
- label: a cancelled run keeps copying the rest of the folder
  find: "    for job in group:\n        if cancel.is_set():\n            return\n        finish(_run_row(job, index, target))"
  replace: "    for job in group:\n        finish(_run_row(job, index, target))"
  test: tests.test_fetch_core.RunnerTests.test_cancel_stops_inside_a_folder_and_keeps_what_was_done
- label: an unknown layout is accepted
  find: "    if options.layout not in LAYOUTS:\n        raise ValueError"
  replace: "    if False:\n        raise ValueError"
  test: tests.test_fetch_core.RunnerTests.test_job_run_reports_progress_and_final_state
- label: a destination inside a source folder is accepted
  find: "            if _key(current) in sources:"
  replace: "            if False:"
  test: tests.test_fetch_core.RunnerTests.test_a_destination_inside_or_equal_to_a_source_folder_is_refused_before_anything_is_written
- label: the final result list is re-ordered under a poller
  find: "            run_job(self.rows, self.dest, self.options, self._record, self._cancel)\n"
  replace: "            self._results = run_job(self.rows, self.dest, self.options, self._record, self._cancel)[::-1]\n"
  test: tests.test_fetch_core.RunnerTests.test_results_a_poller_already_holds_are_a_prefix_of_the_final_list
- label: by_folder targets are not checked against the sources
  find: "    if layout == \"by_folder\":\n"
  replace: "    if False:\n"
  test: tests.test_fetch_core.RunnerTests.test_the_by_folder_layout_cannot_aim_a_copy_at_a_source_folder
- label: symlinks and junctions are not resolved before comparing
  find: "    return _key(os.path.normcase(os.path.realpath(path)))"
  replace: "    return _key(os.path.normcase(os.path.abspath(path)))"
  test: tests.test_fetch_core.RunnerTests.test_a_destination_reached_through_a_symlink_into_a_source_is_refused
- label: a root folder loses its separator and matches nothing
  find: "    return drive + (stripped or pathmod.sep)"
  replace: "    return drive + stripped"
  test: tests.test_fetch_core.RunnerTests.test_roots_and_unc_shares_have_one_spelling_in_windows_form
- label: an unreadable sub-folder is not reported
  find: "    if index.unreadable:  # a sub-folder could not be opened: other matches, or this file, may be inside it"
  replace: "    if False:  # a sub-folder could not be opened: other matches, or this file, may be inside it"
  test: tests.test_fetch_core.RunnerTests.test_an_unreadable_subfolder_is_reported_instead_of_hidden
- label: a search that found nothing in a partly unreadable folder still says not found
  find: "    elif result.warning:\n        result.status = \"scan_incomplete\""
  replace: "    elif False:\n        result.status = \"scan_incomplete\""
  test: tests.test_fetch_core.RunnerTests.test_an_unreadable_subfolder_is_reported_instead_of_hidden
- label: folders are grouped with case and Unicode folding
  find: "            runnable.setdefault(_key(os.path.normcase(job.address)), []).append(job)"
  replace: "            runnable.setdefault(str(job.address).casefold(), []).append(job)"
  test: tests.test_fetch_core.RunnerTests.test_folders_whose_names_differ_only_by_case_are_not_merged_when_the_filesystem_keeps_them_apart
