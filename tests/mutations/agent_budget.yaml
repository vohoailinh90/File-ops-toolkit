# Mutation manifest — see scripts/mutation_check.py
#
# A passing test proves nothing on its own. These break each behavior in turn
# and require the named test to fail. A mutation that SURVIVES means the test
# guards nothing.

target: scripts/hooks/agent_budget.py
note: The hook is what makes max_agent_invocations a refusal rather than prose. Each entry removes one
  piece of the accounting and names the test that must notice.
mutations:
- label: the Task spelling of the spawn tool is no longer a spawn
  find: SPAWN_TOOLS = {"Agent", "Task"}
  replace: SPAWN_TOOLS = {"Agent"}
  test: tests.test_agent_budget.DecisionTests.test_the_legacy_task_tool_name_counts_as_a_spawn
- label: a reserve pays for any agent
  find: '        if reserve.get("spent_by") is None and agent in reserve.get("grantable_agents", []):

    '
  replace: '        if reserve.get("spent_by") is None:

    '
  test: tests.test_agent_budget.ChargingTests.test_a_non_grantable_agent_cannot_take_a_reserve_slot
- label: a full base pays out when a reserve the agent may not take is unspent
  find: "    elif base_used(ledger) < ledger[\"base\"]:\n        charged_to = \"base\"\n    else:\n  \
    \      raise BudgetExceeded(refusal(ledger, agent))\n"
  replace: "    else:\n        charged_to = \"base\"\n"
  test: tests.test_agent_budget.ChargingTests.test_a_non_grantable_agent_cannot_take_a_reserve_slot
- label: a reserve can be granted past its amount
  find: "    if already >= runtime[\"amount\"]:\n        raise LedgerError(f\"{reserve_name} is already\
    \ fully granted ({already}/{runtime['amount']}) at {ledger['tier']}\")\n"
  replace: ''
  test: tests.test_agent_budget.GrantTests.test_escalation_reserve_is_granted_once_and_only_for_its_agent
- label: a reserve can be granted to an agent it may not pay for
  find: "    if agent is not None and agent not in grantable:\n        raise LedgerError(f\"{reserve_name}\
    \ may only pay for {grantable}, not {agent}\")\n"
  replace: ''
  test: tests.test_agent_budget.GrantTests.test_escalation_reserve_is_granted_once_and_only_for_its_agent
- label: CLAUDE_AGENT_BUDGET_UNROUTED=deny is ignored
  find: "            if os.environ.get(UNROUTED_VAR, \"\").strip().lower() == \"deny\":\n            \
    \    return \"deny\", UNROUTED_NUDGE + \" (Refused: CLAUDE_AGENT_BUDGET_UNROUTED=deny.)\"\n"
  replace: ''
  test: tests.test_agent_budget.DecisionTests.test_unrouted_spawns_are_denied_when_asked
- label: a corrupt ledger goes silent
  find: "        except LedgerError as exc:\n            log(f\"{exc}; treating the checkout as unrouted\"\
    )\n            ledger = None\n"
  replace: "        except LedgerError:\n            ledger = None\n"
  test: tests.test_agent_budget.DecisionTests.test_a_corrupt_ledger_fails_open_as_unrouted_and_says_so
- label: a foreign ledger version is trusted
