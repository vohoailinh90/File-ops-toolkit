    \ {ledger.get('version')!r} is not {LEDGER_VERSION}\")\n"
  replace: ''
  test: tests.test_agent_budget.LedgerBuildTests.test_a_corrupt_or_foreign_ledger_is_an_error_not_a_budget
- label: an unexpected error breaks the session instead of failing open
