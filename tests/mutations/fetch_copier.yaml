# Mutation manifest — see scripts/mutation_check.py
target: file_ops_toolkit/copier.py
note: The destination is never overwritten, and "already copied" means identical bytes.
mutations:
- label: any existing file with the name counts as the earlier copy
  find: "            if _same_file(source, candidate, stat):"
  replace: "            if True:"
  test: tests.test_fetch_core.CopierTests.test_a_different_file_with_the_same_name_is_never_overwritten
- label: size and time alone decide that a file is the earlier copy
  find: "        return _same_bytes(source, candidate)\n"
  replace: "        return True\n"
  test: tests.test_fetch_core.RunnerTests.test_every_row_gets_a_status_and_all_matches_are_copied
- label: an identical earlier copy is written again under a new name
  find: "                return CopyOutcome(str(candidate), True)"
  replace: "                continue"
  test: tests.test_fetch_core.CopierTests.test_identical_copy_from_an_earlier_run_is_reported_not_duplicated
- label: a failed copy leaves its .part file behind
  find: "        except BaseException:\n            _discard(part)\n            raise"
  replace: "        except BaseException:\n            raise"
  test: tests.test_fetch_core.CopierTests.test_a_failed_copy_leaves_no_partial_file
- label: the copy does not keep the source's modification time
  find: "        shutil.copystat(source, final)\n"
  replace: "        pass\n"
  test: tests.test_fetch_core.CopierTests.test_copy_keeps_content_and_leaves_the_source_alone
- label: the temporary file is a predictable name that can belong to someone else
  find: "            fd, part_name = tempfile.mkstemp(dir=target_dir, prefix=TEMP_PREFIX, suffix=\".part\")"
  replace: "            part_name = str(candidate) + \".part\"\n            fd = os.open(part_name, os.O_CREAT | os.O_WRONLY | os.O_TRUNC)"
  test: tests.test_fetch_core.CopierTests.test_an_existing_part_file_of_the_user_is_never_deleted_or_overwritten
- label: without hard links the final file is created with replacement
  find: "    writer = open(final, \"xb\")"
  replace: "    writer = open(final, \"wb+\")"
  test: tests.test_fetch_core.CopierTests.test_without_hard_links_the_final_name_is_still_never_replaced
- label: the copy does not get the source's modification time
  find: "        shutil.copystat(source, final)\n"
  replace: "        pass\n"
  test: tests.test_fetch_core.CopierTests.test_without_hard_links_a_second_run_still_recognises_the_first_copy
- label: the temporary file name embeds the whole target name
  find: "prefix=TEMP_PREFIX, suffix="
  replace: "prefix=candidate.name + \".\", suffix="
  test: tests.test_fetch_core.CopierTests.test_a_file_name_near_the_length_limit_can_be_copied
- label: the source's metadata is applied to the temporary file before it is published
  find: "            _publish(part, candidate)  # the temporary name is gone when this returns\n"
  replace: "            shutil.copystat(source, part)\n            _publish(part, candidate)  # the temporary name is gone when this returns\n"
  test: tests.test_fetch_core.CopierTests.test_a_read_only_source_does_not_leave_its_temporary_file_undeletable
- label: contents are compared through a cache that ignores an in-place change
  find: "        return _same_bytes(source, candidate)\n"
  replace: "        return __import__(\"filecmp\").cmp(source, candidate, shallow=False)\n"
  test: tests.test_fetch_core.CopierTests.test_a_source_changed_in_place_with_the_same_size_and_time_is_not_taken_for_the_old_copy
- label: numbered names are not shortened to the component limit
  find: "    fitted = stem.encode(\"utf-8\")[:max(room, 1)].decode(\"utf-8\", \"ignore\")  # never cut a character in half\n"
  replace: "    fitted = stem\n"
  test: tests.test_fetch_core.CopierTests.test_a_numbered_name_is_shortened_to_fit_the_component_limit
