# Mutation manifest — see scripts/mutation_check.py
target: file_ops_toolkit/paths.py
note: What a cell may mean as a folder, and which column-B values are refused.
mutations:
- label: a path separator in a file name is accepted
  find: "    if \"/\" in name or \"\\\\\" in name or \"\\x00\" in name or name in (\".\", \"..\"):"
  replace: "    if \"\\x00\" in name or name in (\".\", \"..\"):"
  test: tests.test_fetch_core.AddressTests.test_file_names_with_separators_or_parent_references_are_invalid
- label: web links are treated as folders
  find: "    if _SCHEME.match(s):\n        raise AddressError(\"unsupported_link\")"
  replace: "    if False:\n        raise AddressError(\"unsupported_link\")"
  test: tests.test_fetch_core.AddressTests.test_web_links_and_blanks_are_refused_with_a_code
- label: a file://server/share link is not turned into a UNC path
  find: "        return \"\\\\\\\\\" + host + \"\\\\\" + tail.replace(\"/\", \"\\\\\")  # file://server/share/dir"
  replace: "        return host + \"\\\\\" + tail.replace(\"/\", \"\\\\\")  # file://server/share/dir"
  test: tests.test_fetch_core.AddressTests.test_file_urls_become_windows_paths
- label: "percent escapes in a file: link are kept"
  find: "    rest = unquote(rest)\n"
  replace: ""
  test: tests.test_fetch_core.AddressTests.test_file_urls_become_windows_paths
- label: relative text is accepted as a folder
  find: "    if not (looks_like_path(s) or os.path.isabs(s)):"
  replace: "    if False:"
  test: tests.test_fetch_core.AddressTests.test_text_that_is_not_an_absolute_path_is_refused
